<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Altitude">
  <meta name="theme-color" content="#0a0a1f">
  <meta name="description" content="Altitude — daily walking breath-hold training for VO2 max.">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>Altitude</title>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="tabs" class="tabs" hidden>
    <button data-tab="today" class="tab"><svg viewBox="0 0 24 24"><path d="M3 20 9.5 8l4 7 2.5-4L21 20z"/></svg><span>Today</span></button>
    <button data-tab="progress" class="tab"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progress</span></button>
    <button data-tab="settings" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>
  <section id="overlay" class="overlay" hidden></section>
  <audio id="player" preload="auto" playsinline></audio>
  <script type="module" src="js/app.js"></script>
</body>
